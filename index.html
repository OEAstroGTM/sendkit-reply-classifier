<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reply Pipeline</title>
<style>
  :root{
    --bg:#0f1117; --card:#181b23; --border:#2a2e3a; --text:#e6e8ee; --muted:#8b90a0;
    --accent:#4f8cff; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --purple:#a855f7;
    --blue:#3b82f6; --gray:#6b7280; --input-bg:#10131a; --btn2-bg:#262a36; --btn2-text:#e6e8ee;
    --col-bg:#12151c;
  }
  [data-theme="light"]{
    --bg:#f5f6f8; --card:#fff; --border:#e2e5ea; --text:#1a1d26; --muted:#6b7180;
    --accent:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --purple:#9333ea;
    --blue:#2563eb; --gray:#6b7280; --input-bg:#f2f4f7; --btn2-bg:#e8eaef; --btn2-text:#1a1d26;
    --col-bg:#eef0f4;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:24px 16px 60px}
  .wrap{max-width:1400px;margin:0 auto}
  h1{font-size:21px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
  input,select{background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font:inherit}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.1)} button:disabled{opacity:.5;cursor:wait}
  button.secondary{background:var(--btn2-bg);color:var(--btn2-text)}
  .bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .hint{color:var(--muted);font-size:12px}
  .err{color:var(--red)}
  .hide{display:none}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
  .kpi .v{font-size:23px;font-weight:700;line-height:1.1}
  .kpi .l{font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
  .kpi.good .v{color:var(--green)} .kpi.warn .v{color:var(--amber)} .kpi.bad .v{color:var(--red)}

  .board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:12px;align-items:start}
  @media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(260px,1fr))}}
  @media(max-width:680px){.board{grid-template-columns:1fr}}
  .col{background:var(--col-bg);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:80px}
  .col h3{font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;padding:0 2px}
  .col h3 .n{background:var(--btn2-bg);color:var(--btn2-text);border-radius:99px;padding:1px 9px;font-size:12px}
  .col.act h3{color:var(--amber)} .col.warm h3{color:var(--blue)}
  .col.wait h3{color:var(--muted)} .col.done h3{color:var(--green)}

  .lead{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--gray);
        border-radius:9px;padding:10px 11px;margin-bottom:8px}
  .lead.sl{border-left-color:var(--accent)} .lead.sk{border-left-color:var(--purple)}
  .lead .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .lead .nm{font-weight:600;font-size:13.5px}
  .lead .co{color:var(--muted);font-size:12px;margin-top:1px}
  .lead .said{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45;
              border-left:2px solid var(--border);padding-left:8px}
  .age{font-size:11.5px;font-weight:600;white-space:nowrap}
  .age.hot{color:var(--red)} .age.warm{color:var(--amber)} .age.cold{color:var(--muted)}
  .tags{margin-top:7px;display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--btn2-bg);color:var(--btn2-text)}
  .src{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;font-weight:700}
  .src.sl{background:rgba(79,140,255,.16);color:var(--accent)}
  .src.sk{background:rgba(168,85,247,.16);color:var(--purple)}
  .alert{border:1px solid var(--red);background:rgba(239,68,68,.07);border-radius:10px;padding:12px;margin-bottom:14px}
  .alert h3{font-size:13px;color:var(--red);margin-bottom:7px}
  .alert .row{font-size:12.5px;padding:3px 0}
  details{margin-top:14px} summary{cursor:pointer;color:var(--muted);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:9px}
  th{text-align:left;color:var(--muted);font-weight:500;padding:5px 7px;border-bottom:1px solid var(--border)}
  td{padding:6px 7px;border-bottom:1px solid var(--border);vertical-align:top}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <h1>Reply Pipeline</h1>
      <div class="sub">Every lead that replied, across Smartlead and SendKit, by what it needs next.</div>
    </div>
    <button id="btn-theme" class="secondary" style="padding:6px 12px;font-size:13px">&#9788; Light</button>
  </div>

  <div class="card">
    <div class="bar">
      <div><label>Setup secret</label><input id="secret" type="password" placeholder="secret" style="width:180px"></div>
      <div><label>Source</label>
        <select id="src"><option value="all">Both platforms</option><option value="sl">Smartlead only</option><option value="sk">SendKit only</option></select>
      </div>
      <button id="btn-load">Load pipeline</button>
      <div class="hint" id="stamp" style="margin-left:auto"></div>
    </div>
  </div>

  <div id="alerts"></div>
  <div id="kpis" class="kpis hide"></div>
  <div id="board" class="board hide"></div>
  <div id="extra"></div>
</div>

<script>
const $=(id)=>document.getElementById(id);
const themeBtn=$("btn-theme");
function applyTheme(t){document.documentElement.dataset.theme=t;themeBtn.innerHTML=t==="light"?"&#9789; Dark":"&#9788; Light";localStorage.setItem("pl_theme",t);}
applyTheme(localStorage.getItem("pl_theme")||(window.matchMedia?.("(prefers-color-scheme: light)").matches?"light":"dark"));
themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==="light"?"dark":"light");

const secretEl=$("secret");
secretEl.value=localStorage.getItem("pl_secret")||"";
secretEl.addEventListener("change",()=>localStorage.setItem("pl_secret",secretEl.value.trim()));
$("src").value=localStorage.getItem("pl_src")||"all";
$("src").addEventListener("change",()=>localStorage.setItem("pl_src",$("src").value));

const esc=(s)=>String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function key(){const k=secretEl.value.trim();if(!k){alert("Enter your setup secret first.");throw new Error("no key");}return encodeURIComponent(k);}
// Responses are cached upstream and will come back byte-identical, timestamp
// included, so every request carries a throwaway parameter.
const nonce=()=>Math.random().toString(36).slice(2,9);
async function api(path){
  try{
    const r=await fetch(path+`&fresh=1&nonce=${nonce()}`);
    const t=await r.text();
    if(!t.trim()) return {error:"empty response (the request most likely timed out)"};
    try{return JSON.parse(t);}catch{return {error:t.slice(0,300)};}
  }catch(e){return {error:e.message};}
}

const age=(h)=>h==null?"":h<48?`${Math.round(h)}h`:`${Math.round(h/24)}d`;
const ageCls=(h)=>h==null?"cold":h>=120?"hot":h>=48?"warm":"cold";

function leadCard(x){
  const s=x.src==="sk"?"sk":"sl";
  return `<div class="lead ${s}">
    <div class="top">
      <div><div class="nm">${esc(x.name||x.email)}</div>
           <div class="co">${esc(x.company||x.email)}</div></div>
      <div class="age ${ageCls(x.hours)}">${age(x.hours)}</div>
    </div>
    ${x.said?`<div class="said">${esc(String(x.said).slice(0,150))}</div>`:""}
    <div class="tags"><span class="src ${s}">${s==="sk"?"SendKit":"Smartlead"}</span>
      ${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
      ${x.note?`<span class="tag">${esc(x.note)}</span>`:""}</div>
  </div>`;
}
function column(cls,title,items,empty){
  return `<div class="col ${cls}"><h3>${title}<span class="n">${items.length}</span></h3>
    ${items.length?items.map(leadCard).join(""):`<div class="hint" style="padding:6px 2px">${empty}</div>`}</div>`;
}

$("btn-load").onclick=async()=>{
  const btn=$("btn-load"); btn.disabled=true; btn.textContent="Loading…";
  $("alerts").innerHTML=""; $("extra").innerHTML="";
  $("board").classList.remove("hide"); $("kpis").classList.add("hide");
  $("board").innerHTML=`<div class="hint" style="padding:10px">Reading both platforms…</div>`;
  const want=$("src").value, k=key();

  const [inbox,fups,skq]=await Promise.all([
    want!=="sk"?api(`/api/smartlead?key=${k}&action=inbox&max=40&threads=14`):Promise.resolve(null),
    want!=="sk"?api(`/api/smartlead?key=${k}&action=followups&days=30`):Promise.resolve(null),
    want!=="sl"?api(`/api/queue?key=${k}&max=25`):Promise.resolve(null),
  ]);

  const errs=[];
  if(inbox?.error) errs.push(`Smartlead inbox: ${inbox.error}`);
  if(fups?.error) errs.push(`Smartlead follow-ups: ${fups.error}`);
  if(skq?.error) errs.push(`SendKit queue: ${skq.error}`);

  // --- needs a reply, both platforms ---
  const needs=[
    ...((inbox?.awaiting)||[]).map(x=>({src:"sl",name:x.name,company:x.company,email:x.email,
      hours:x.hoursWaiting,said:x.said,tags:x.category&&x.category!=="(uncategorized)"?[x.category]:[]})),
    ...((skq?.queue)||[]).map(x=>({src:"sk",name:x.lead,company:x.company,email:x.email,
      hours:x.hoursWaiting,said:x.lastMessagePreview,tags:x.tags||[]})),
  ].sort((a,b)=>(b.hours??0)-(a.hours??0));

  const F=(fups?.followups)||[];
  const mk=(x,note)=>({src:"sl",name:x.name,company:x.company,email:x.email,
    hours:x.daysQuiet*24,said:x.theySaid,tags:x.category?[x.category]:[],note});
  const due   =F.filter(x=>x.due).map(x=>mk(x,`bump ${x.bumpsSent+1}`));
  const waiting=F.filter(x=>!x.due&&!x.hold&&!x.exhausted).map(x=>mk(x,x.nextBumpInDays!=null?`next in ${x.nextBumpInDays}d`:null));
  const held  =F.filter(x=>x.hold).map(x=>mk(x,x.hold));

  // --- alerts ---
  const opt=(inbox?.optOutsToSuppress)||[];
  if(opt.length) $("alerts").innerHTML=`<div class="alert"><h3>&#9888;&#65039; ${opt.length} opt-out${opt.length>1?"s":""} not yet suppressed</h3>`+
    opt.map(o=>`<div class="row"><b>${esc(o.name)}</b> &lt;${esc(o.email)}&gt; &mdash; ${esc((o.said||"").slice(0,90))}</div>`).join("")+
    `<div class="hint" style="margin-top:6px">Suppress these before the next send.</div></div>`;
  if(errs.length) $("alerts").innerHTML+=`<div class="alert"><h3>Could not load everything</h3>`+
    errs.map(e=>`<div class="row">${esc(e)}</div>`).join("")+`</div>`;

  // --- kpis ---
  const oldest=Math.max(0,...needs.map(x=>x.hours||0));
  $("kpis").classList.remove("hide");
  $("kpis").innerHTML=`
    <div class="kpi ${needs.length?"warn":"good"}"><div class="v">${needs.length}</div><div class="l">Needs reply</div></div>
    <div class="kpi ${due.length?"warn":""}"><div class="v">${due.length}</div><div class="l">Follow-up due</div></div>
    <div class="kpi"><div class="v">${waiting.length}</div><div class="l">Waiting on them</div></div>
    <div class="kpi good"><div class="v">${held.length}</div><div class="l">Booked or held</div></div>
    <div class="kpi ${oldest>=120?"bad":oldest>=48?"warn":"good"}"><div class="v">${oldest?age(oldest):"0"}</div><div class="l">Oldest unanswered</div></div>
    <div class="kpi"><div class="v">${inbox?.instantMachines??0}</div><div class="l">Machines filtered</div></div>`;

  $("board").innerHTML=
    column("act","Needs reply",needs,"Nothing waiting on you.")+
    column("warm","Follow-up due",due,"Nothing due today.")+
    column("wait","Waiting on them",waiting,"Nobody pending.")+
    column("done","Booked or held",held,"Nothing booked.");

  const dec=(inbox?.declined)||[];
  $("extra").innerHTML=`
    <details><summary>Closed this window &mdash; ${dec.length} declined</summary>
      <table><tr><th>Lead</th><th>Company</th><th>Said</th></tr>
      ${dec.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.company||"")}</td><td>${esc((x.said||"").slice(0,110))}</td></tr>`).join("")||`<tr><td colspan="3" class="hint">None.</td></tr>`}
      </table></details>
    <div class="hint" style="margin-top:14px">
      Smartlead cards are decided from the reply text, not Smartlead's category tags, because most replies come back uncategorised.
      SendKit is still tag-based and read only, so reply to those in SendKit itself, and note that the follow-up cadence covers Smartlead only.
    </div>`;

  $("stamp").textContent="Loaded "+new Date().toLocaleTimeString();
  btn.disabled=false; btn.textContent="Refresh";
};
if(secretEl.value) $("btn-load").click();
</script>
</body>
</html>
