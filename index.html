<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reply Agent — Smartlead</title>
<style>
  :root {
    --bg:#0f1117; --card:#181b23; --border:#2a2e3a; --text:#e6e8ee; --muted:#8b90a0;
    --accent:#4f8cff; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --purple:#a855f7;
    --blue:#3b82f6; --gray:#6b7280; --input-bg:#10131a; --btn2-bg:#262a36; --btn2-text:#e6e8ee;
  }
  [data-theme="light"] {
    --bg:#f5f6f8; --card:#fff; --border:#e2e5ea; --text:#1a1d26; --muted:#6b7180;
    --accent:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --purple:#9333ea;
    --blue:#2563eb; --gray:#6b7280; --input-bg:#f2f4f7; --btn2-bg:#e8eaef; --btn2-text:#1a1d26;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:28px 16px}
  .wrap{max-width:940px;margin:0 auto}
  h1{font-size:21px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .card h2{font-size:15px;margin-bottom:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit}
  textarea{min-height:200px;resize:vertical}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
  button:hover{filter:brightness(1.1)}
  button.secondary{background:var(--btn2-bg);color:var(--btn2-text)}
  button:disabled{opacity:.5;cursor:wait}
  pre{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word;margin-top:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .kpi .v{font-size:24px;font-weight:700;line-height:1.1}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.03em}
  .kpi.good .v{color:var(--green)} .kpi.warn .v{color:var(--amber)} .kpi.bad .v{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border)}
  td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  td.n,th.n{text-align:right}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:150px}
  .preview{background:#fff;color:#111;border-radius:8px;padding:22px;margin-top:12px;font-family:Arial,sans-serif;line-height:1.6}
  .preview a{color:#1a56db}
  .said{margin-top:10px;padding:12px;border-radius:8px;background:var(--input-bg);font-size:13px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .err{color:var(--red)}
  .hide{display:none}
  .flag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(245,158,11,.18);color:var(--amber);border:1px solid var(--amber);margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <h1>Reply Agent</h1>
    <button id="btn-theme" class="secondary" style="margin-top:0;padding:6px 12px;font-size:13px">&#9788; Light</button>
  </div>
  <div class="sub">Smartlead inbox management — find positive replies, answer them, book meetings.</div>

  <div class="card">
    <h2>&#128273; Access</h2>
    <input id="secret" type="password" placeholder="setup secret">
    <div class="hint">Stored in this browser only.</div>
  </div>

  <div class="card">
    <h2>&#128202; Inbox performance</h2>
    <button id="btn-stats">Load performance</button>
    <div id="stats-out" class="hide"></div>
  </div>

  <div class="card">
    <h2>&#9993;&#65039; Reply queue</h2>
    <div class="hint">Positive replies where the lead spoke last. Nothing else is waiting on you.</div>
    <div class="row">
      <select id="campaign"><option value="">All live campaigns</option></select>
      <button id="btn-queue">Load queue</button>
    </div>
    <div id="queue-out" class="hide"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const themeBtn = $("btn-theme");
function applyTheme(t){document.documentElement.dataset.theme=t;themeBtn.innerHTML=t==="light"?"&#9789; Dark":"&#9788; Light";localStorage.setItem("sl_theme",t);}
applyTheme(localStorage.getItem("sl_theme") || (window.matchMedia?.("(prefers-color-scheme: light)").matches?"light":"dark"));
themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==="light"?"dark":"light");

const secretEl = $("secret");
secretEl.value = localStorage.getItem("sl_secret") || "";
secretEl.addEventListener("change", () => { localStorage.setItem("sl_secret", secretEl.value.trim()); loadCampaigns(); });

const esc = (s) => String(s ?? "").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CAT_COLORS = {"Interested":"var(--green)","Meeting Request":"var(--blue)","Information Request":"var(--purple)"};
const pill = (t) => `<span class="pill" style="background:${CAT_COLORS[t]||"var(--gray)"}">${esc(t)}</span>`;
function key(){ const k=secretEl.value.trim(); if(!k){alert("Enter your setup secret first.");throw new Error("no key");} return encodeURIComponent(k); }
async function api(path){ const r = await fetch(path + `&_=${Date.now()}`); const t = await r.text(); try{return JSON.parse(t);}catch{return {error:t.slice(0,400)};} }

// ---------- campaigns ----------
async function loadCampaigns(){
  if(!secretEl.value.trim()) return;
  const d = await api(`/api/smartlead?key=${key()}&action=campaigns`);
  if(d.error||!d.campaigns) return;
  const sel = $("campaign");
  sel.innerHTML = `<option value="">All live campaigns</option>` +
    d.campaigns.filter(c=>c.status!=="DRAFTED"&&c.status!=="ARCHIVED").map(c=>`<option value="${c.id}">${esc(c.name)}${c.status!=="ACTIVE"?" ("+c.status.toLowerCase()+")":""}</option>`).join("");
}
loadCampaigns();

// ---------- performance ----------
$("btn-stats").onclick = async () => {
  const out=$("stats-out"); out.classList.remove("hide");
  out.innerHTML="<pre>Reading every reply and checking which are answered. This takes a moment…</pre>";
  const d = await api(`/api/smartlead?key=${key()}&action=stats`);
  if(d.error){out.innerHTML=`<pre class="err">${esc(d.error)}</pre>`;return;}
  const t=d.totals;
  const kpi=(v,l,cls="")=>`<div class="kpi ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  out.innerHTML = `<div class="kpis" style="margin-top:14px">
      ${kpi(t.positives,"Positive replies")}
      ${kpi(t.awaiting, "Awaiting reply", t.awaiting>0?"warn":"good")}
      ${kpi(t.answeredPct+"%","Answered", t.answeredPct>=90?"good":t.answeredPct>=60?"warn":"bad")}
      ${kpi(t.medianResponseHours==null?"—":t.medianResponseHours+"h","Median response")}
      ${kpi(t.oldestWaitingHours?Math.round(t.oldestWaitingHours)+"h":"—","Longest wait", t.oldestWaitingHours>24?"bad":"")}
      ${kpi(t.positivesPer1k,"Positives / 1k sent")}
      ${kpi(t.machinePct+"%","Autoresponders", t.machinePct>80?"bad":t.machinePct>50?"warn":"")}
      ${kpi(t.replies,"Total replies")}
    </div>
    <table><tr><th>Campaign</th><th class="n">Sent</th><th class="n">Replies</th><th class="n">Human</th><th class="n">Positive</th><th class="n">Answered</th><th class="n">Waiting</th><th class="n">/1k</th></tr>` +
    d.campaigns.map(c=>c.error
      ? `<tr><td>${esc(c.name)}</td><td colspan="7" class="err">${esc(c.error)}</td></tr>`
      : `<tr><td>${esc(c.name)}</td><td class="n">${c.sent.toLocaleString()}</td><td class="n">${c.replies}</td>
         <td class="n">${c.humanReplies}</td><td class="n">${c.positives}</td><td class="n">${c.answered}</td>
         <td class="n" style="${c.awaiting?"color:var(--amber);font-weight:600":""}">${c.awaiting}</td>
         <td class="n">${c.positivesPer1k}</td></tr>`).join("") +
    `</table><div class="hint">Positive = Interested, Meeting Request or Information Request, matching Smartlead's own categories. Autoresponders are replies arriving under 60 seconds. Generated ${new Date(d.generatedAt).toLocaleString()}.</div>`;
};

// ---------- queue ----------
let Q={items:[],i:0};
$("btn-queue").onclick = async () => {
  const out=$("queue-out"); out.classList.remove("hide");
  out.innerHTML="<pre>Finding positive replies that are waiting on you…</pre>";
  const cid=$("campaign").value;
  let ids=[];
  if(cid) ids=[cid];
  else {
    const c = await api(`/api/smartlead?key=${key()}&action=campaigns`);
    ids=(c.campaigns||[]).filter(x=>x.status!=="DRAFTED"&&x.status!=="ARCHIVED").map(x=>String(x.id));
  }
  const all=[];
  for(const id of ids){
    const d = await api(`/api/smartlead?key=${key()}&action=queue&campaign_id=${id}`);
    if(d.queue) all.push(...d.queue.map(x=>({...x,campaign_id:id})));
  }
  Q={items:all.sort((a,b)=>(b.hoursWaiting||0)-(a.hoursWaiting||0)),i:0};
  if(!Q.items.length){out.innerHTML=`<div class="hint" style="margin-top:12px">Queue is empty. Every positive reply has been answered. &#127881;</div>`;return;}
  showItem();
};

function header(c){
  const flags=[];
  if(/whatsapp/i.test(c.said)) flags.push("Wants WhatsApp");
  if(/\bcall me\b|my number|reach me at/i.test(c.said)) flags.push("Gave a number");
  if(/price|pricing|cost|how much|\$\s?\d/i.test(c.said)) flags.push("Pricing");
  if(/not a|we are not|wrong|mix-?up/i.test(c.said)) flags.push("Possible mismatch");
  return `<div style="margin-top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><b>${esc(c.name||c.email)}</b> <span class="hint">${esc(c.company||"")} ${c.title?"· "+esc(c.title):""}</span><br>
        <span class="hint">${esc(c.email)} ${c.location?"· "+esc(c.location):""} ${c.phone?"· "+esc(c.phone):""}</span></div>
      <div style="text-align:right">${pill(c.category)}<br><span class="hint">${c.hoursWaiting}h waiting · ${Q.i+1} of ${Q.items.length}</span></div>
    </div>
    ${flags.length?`<div style="margin-top:6px">${flags.map(f=>`<span class="flag">&#9873; ${f}</span>`).join("")}</div>`:""}
    <div class="said"><span class="hint">They said:</span><br>${esc(c.said)}</div>`;
}

async function showItem(){
  const out=$("queue-out");
  if(Q.i>=Q.items.length){out.innerHTML=`<div class="hint" style="margin-top:12px">Done. Worked through all ${Q.items.length}. &#127881;</div>`;return;}
  const c=Q.items[Q.i];
  out.innerHTML=header(c)+`<pre>Reading the thread, pulling your availability and writing a reply…</pre>`;
  const d = await api(`/api/smartlead?key=${key()}&action=draft&campaign_id=${c.campaign_id}&email=${encodeURIComponent(c.email)}`);
  if(d.error){
    out.innerHTML=header(c)+`<pre class="err">${esc(d.error)}</pre>
      <div class="row"><button id="q-retry" class="secondary">Retry</button><button id="q-skip" class="secondary">Skip</button></div>`;
    $("q-retry").onclick=showItem; $("q-skip").onclick=next; return;
  }
  c.draft={body:d.body,slots:d.slots||[],html:d.html};
  render(c);
}

function render(c){
  $("queue-out").innerHTML=header(c)+
    `<div class="preview">${c.draft.html||esc(c.draft.body)}</div>
     <div class="hint">Times are booking links checked against every connected calendar. Signed as ${esc(c.persona||"the campaign persona")}.</div>
     <div class="row">
       <button id="q-send">Send</button>
       <button id="q-edit" class="secondary">Edit</button>
       <button id="q-regen" class="secondary">Regenerate</button>
       <button id="q-skip" class="secondary">Skip</button>
     </div>`;
  $("q-send").onclick=()=>send(c);
  $("q-edit").onclick=()=>edit(c);
  $("q-regen").onclick=showItem;
  $("q-skip").onclick=next;
}

function edit(c){
  $("queue-out").innerHTML=header(c)+
    `<label style="margin-top:14px">Edit the reply. Keep the time wording to keep the booking links working.</label>
     <textarea id="q-ed">${esc(c.draft.body)}</textarea>
     <div class="row">
       <button id="q-esend">Send edited</button>
       <button id="q-ecancel" class="secondary">Cancel</button>
     </div>`;
  $("q-ecancel").onclick=()=>render(c);
  $("q-esend").onclick=()=>{c.draft.body=$("q-ed").value;send(c);};
}

async function send(c){
  const out=$("queue-out");
  out.innerHTML=header(c)+`<pre>Sending…</pre>`;
  const r = await fetch(`/api/smartlead?key=${key()}&action=send`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({campaign_id:c.campaign_id,email:c.email,body:c.draft.body,slots:c.draft.slots})
  }).then(x=>x.json()).catch(e=>({error:e.message}));
  if(r.error){
    out.innerHTML=header(c)+`<pre class="err">${esc(r.error)}</pre><div class="row"><button id="q-back" class="secondary">Back</button></div>`;
    $("q-back").onclick=()=>render(c); return;
  }
  out.innerHTML=header(c)+`<div style="margin-top:12px;color:var(--green)"><b>Sent.</b> Exactly what was on screen.</div>`;
  setTimeout(next,900);
}
function next(){Q.i+=1;showItem();}
</script>
</body>
</html>
